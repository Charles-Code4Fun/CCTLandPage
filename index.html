<!DOCTYPE html>
<html lang="EN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTS Carbon Credit CCT</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        
        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .footer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background-color: #ffffff;
            z-index: 99999;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <iframe src="https://cctutscarboncredit.streamlit.app/?embed=true"></iframe>
        
        <div class="footer"></div>
    </div>

</body>
</html>
